name: CI Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Format check
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          make fmt-check

  # Linting
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          install-mode: goinstall
          args: --timeout=5m

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install security tools
        shell: bash
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run gosec
        id: gosec
        shell: bash
        run: |
          GO_BIN="$(go env GOBIN)"
          if [ -z "$GO_BIN" ]; then
            GO_BIN="$(go env GOPATH)/bin"
          fi

          set +e
          "$GO_BIN/gosec" -fmt sarif -out gosec-results.sarif ./...
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload SARIF file
        if: ${{ always() && hashFiles('gosec-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec-results.sarif

      - name: Fail on gosec findings
        if: ${{ steps.gosec.outputs.exit_code != '0' }}
        run: exit 1

      - name: Run govulncheck
        shell: bash
        run: |
          GO_BIN="$(go env GOBIN)"
          if [ -z "$GO_BIN" ]; then
            GO_BIN="$(go env GOPATH)/bin"
          fi

          "$GO_BIN/govulncheck" ./...

  # Tests
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            coverage: true
          - os: macos-latest
            coverage: false
          - os: windows-latest
            coverage: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: make test

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        run: make test-coverage

  # Build verification
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build provider
        run: make build

      - name: Build tools
        run: make buildtool

  # All checks passed
  ci-success:
    name: CI Success
    needs: [format, lint, security, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Success
        run: echo "All CI checks passed!"
