version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck      # Check for unchecked errors
    - govet         # Vet examines Go source code
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Go static analysis
    - unused        # Check for unused constants, variables, functions and types
    - misspell      # Find commonly misspelled English words
    - gocritic      # Opinionated Go linter
    - gosec         # Security problems
    - revive        # Fast, configurable, extensible, flexible linter
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    govet:
      enable-all: true

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
        - opinionated

    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G104  # Audit errors not checked (covered by errcheck)
        - G304  # File path provided as taint input (common in file operations)

    revive:
      rules:
        - name: exported
          severity: warning
          disabled: false
        - name: var-naming
          severity: warning
          disabled: false
        - name: indent-error-flow
          severity: warning
          disabled: false

  exclusions:
    rules:
      # Exclude some linters from running on tests files
      - path: _test\.go
        linters:
          - errcheck
          - gosec

      # Allow this specific revive ALL_CAPS warning across the repo.
      - linters:
          - revive
        text: "var-naming: don't use ALL_CAPS in Go names; use CamelCase"

      # Allow legacy missing exported comments across the repo.
      - linters:
          - revive
        text: "should have comment or be unexported"

      - linters:
          - revive
        text: 'should have comment \(or a comment on this block\) or be unexported'

      # Allow var-naming comment warnings in constants.go.
      - path: ^pkg/client/constants\.go$
        linters:
          - revive
        text: 'var-naming:'

      # Exclude deprecated warnings for dependencies
      - linters:
          - staticcheck
        text: "SA1019:"

formatters:
  enable:
    - gofmt         # Check if code was gofmt-ed
    - goimports     # Check import statements are formatted
  settings:
    gofmt:
      simplify: true

issues:
  max-same-issues: 50
  max-issues-per-linter: 0

output:
  formats:
    text:
      path: stdout
      print-issued-lines: true
      print-linter-name: true
      colors: true
